name: Log Reflection Browser Tests

on:
  pull_request:
    paths:
      - "log-reflection-webapp/**"
      - ".github/workflows/log-reflection-e2e.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: log-reflection-webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: log-reflection-webapp/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-reflection-playwright-report
          path: |
            log-reflection-webapp/playwright-report
            log-reflection-webapp/test-results
          if-no-files-found: ignore
          retention-days: 7
